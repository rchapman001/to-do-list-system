<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List App</title>

    <link rel="stylesheet" href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <style>
        .header {
            background-color: #0056b3;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
        }
        .btn-light-red {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        .hidden {
            display: none; /* CSS class for hiding elements */
        }
        .weather-scroll-bar {
            position: fixed;
            right: 0;
            top: 90px; /* Adjust to align below the header */
            bottom: 0;
            width: 250px;
            overflow-y: scroll;
            padding: 10px;
            background-color: #f8f9fa;
            border-left: 1px solid #dee2e6;
        }
        .weather-scroll-bar h4 {
            text-align: center;
        }
        .list-group-item {
            margin-bottom: 10px;
        }
        .container {
            margin-right: 270px; /* Add margin to make space for the weather scroll bar */
            max-width: calc(100% - 270px); /* Adjust max-width to account for the weather scroll bar */
        }
        .col-4, .col-8 {
            flex: 0 0 auto;
            width: 100%;
        }
        .col-4 {
            max-width: 30%;
        }
        .col-8 {
            max-width: 70%;
        }
    </style>
</head>
<body>
    <header class="header">
        To Do List App
    </header>

    <div class="container mt-4">
        <h2>To Do Lists</h2>

        <div class="row">
            <div class="col-4">
                <div class="p-3 border bg-light">
                    <h4>Lists</h4>
                    <table class="table table-borderless">
                        <tbody>
                            <tr th:each="list : ${toDoLists}">
                                <td>
                                    <button class="btn btn-link" th:onclick="'loadTasksForList(' + ${list.listId} + ');'">
                                        <span th:text="${list.listName}"></span>
                                    </button>
                                </td>
                                <td>
                                    <button class="btn btn-light-red" 
                                            th:onclick="'deleteList(' + ${list.listId} + ');'">Delete</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- Button to Open Create List Modal -->
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createListModal">
                        Create New List
                    </button>
                </div>
            </div>

            <div class="col-8">
                <div class="p-3 border bg-light">
                    <h4>Tasks</h4>
                    <table class="table table-borderless">
                        <thead>
                            <tr>
                                <th>Task Name</th>
                                <th>Task Date</th>
                                <th>Task Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="taskTableBody">
                            <tr th:each="task : ${tasks}" class="task-row">
                                <td th:text="${task.taskName}"></td>
                                <td th:text="${task.taskDate}"></td>
                                <td th:text="${task.taskStatus}"></td>
                                <td>
                                    <button class="btn btn-light-red" 
                                            th:onclick="'deleteTask(' + ${task.taskId} + ');'">Delete</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createTaskModal">Create Task</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Weather Scroll Bar -->
    <div class="weather-scroll-bar">
        <h4>Weather Forecast</h4>
        <ul class="list-group" th:each="forecast : ${forecastSummaryResponseList}">
            <li class="list-group-item">
                <p><strong th:text="${forecast.name}"></strong></p>
                <p th:text="'Temperature: ' + ${forecast.temperature} + '°C'"></p>
                <p th:text="'Wind: ' + ${forecast.windSpeed}"></p>
                <p th:text="'Description: ' + ${forecast.detailedForecast}"></p>
            </li>
        </ul>
    </div>

    <!-- Modal for Creating a New List -->
    <div class="modal fade" id="createListModal" tabindex="-1" aria-labelledby="createListModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createListModalLabel">Create New List</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="createListForm" onsubmit="createList(event);">
                        <div class="mb-3">
                            <label for="listName" class="form-label">List Name</label>
                            <input type="text" class="form-control" id="listName" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Create List</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Creating a Task -->
    <div class="modal fade" id="createTaskModal" tabindex="-1" aria-labelledby="createTaskModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createTaskModalLabel">Create New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="createTaskForm" onsubmit="createTask(event);">
                        <div class="mb-3">
                            <label for="taskName" class="form-label">Task Name</label>
                            <input type="text" class="form-control" id="taskName" required>
                        </div>
                        <div class="mb-3">
                            <label for="taskDate" class="form-label">Task Date</label>
                            <input type="date" class="form-control" id="taskDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="taskStatus" class="form-label">Task Status</label>
                            <select class="form-control" id="taskStatus" required></select>
                        </div>
                        <button type="submit" class="btn btn-primary">Create Task</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>

        let selectedListId; // Global variable for the selected list ID

        console.log("[[${@environment.getProperty('services.list-service.url')}]]");
        console.log("[[${@environment.getProperty('services.task-service.url')}]]");
        console.log("[[${@environment.getProperty('services.weather-service.url')}]]");

        function loadTasksForList(listId) {
            selectedListId = listId; // Set the selected list ID when a list is clicked
            console.log("Selected List ID:", selectedListId); // Log to confirm it's set
            // Clear the existing tasks
            $('#taskTableBody').empty();

            // Make an AJAX call to get tasks for the selected list
            $.get("[[${@environment.getProperty('services.task-service.url')}]]" + 'tasks/list/' + listId, function(tasks) {
                // Populate the task table with new tasks
                tasks.forEach(task => {
                    $('#taskTableBody').append(
                        `<tr id="task_${task.taskId}">
                            <td>${task.taskName}</td>
                            <td>${task.taskDate}</td>
                            <td>${task.taskStatus}</td>
                            <td>
                                <button class="btn btn-light-red" onclick="deleteTask(${task.taskId});">Delete</button>
                            </td>
                        </tr>`
                    );
                });
            });
        }

        function deleteTask(taskId) {
        // Make a DELETE request to the delete endpoint
            $.ajax({
                url: "[[${@environment.getProperty('services.task-service.url')}]]" + 'tasks/' + taskId,
                type: 'DELETE',
                success: function(result) {
                    // Refresh the page after successful deletion
                    // location.reload(); // Reload the current page
                    loadTasksForList(selectedListId);
                },
                error: function(xhr, status, error) {
                    alert('Error deleting task: ' + error);
                }
            });
        }

        async function deleteList(listId) {
            const listServiceUrl = "[[${@environment.getProperty('services.list-service.url')}]]";
            const taskServiceUrl = "[[${@environment.getProperty('services.task-service.url')}]]";

            try {
                // Delete tasks first
                await $.ajax({
                    url: taskServiceUrl + 'tasks/list/' + listId,
                    type: 'DELETE'
                });

                // If task deletion is successful (or ignored), delete the list
                await $.ajax({
                    url: listServiceUrl + 'lists/' + listId,
                    type: 'DELETE'
                });

                // Reload the page after successful deletion
                location.reload();
            } catch (error) {
                const errorMessage = error.responseText || error.statusText || "";

                // Ignore error if no tasks are found (status 404 or message "No tasks found")
                if (errorMessage.includes("No tasks found") || error.status === 404) {
                    console.warn('No tasks to delete, continuing with list deletion.');
                    try {
                        // Attempt to delete the list even if no tasks exist
                        await $.ajax({
                            url: listServiceUrl + 'lists/' + listId,
                            type: 'DELETE'
                        });

                        // Reload the page after successful list deletion
                        location.reload();
                    } catch (listError) {
                        alert('Error deleting list: ' + (listError.responseText || listError.statusText));
                    }
                } else {
                    alert('Error deleting tasks or list: ' + errorMessage);
                }
            }
        }


        function createList(event) {
            event.preventDefault(); // Prevent the default form submission

            var listName = $('#listName').val(); // Get the value from the input field

            // Make a POST request to create a new list
            $.ajax({
                url: "[[${@environment.getProperty('services.list-service.url')}]]" + 'lists', // Update with your endpoint for creating lists
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ listName: listName }), // Send list name as JSON
                success: function(result) {
                    // Refresh the page after successful creation
                    location.reload(); // Reload the current page
                },
                error: function(xhr, status, error) {
                    alert('Error creating list: ' + error);
                }
            });
        }

        function createTask(event) {
            event.preventDefault(); // Prevent form submission

            // Ensure selectedListId is defined
            if (typeof selectedListId === 'undefined') {
                alert('Please select a list first.');
                return;
            }

            const taskName = $('#taskName').val();
            const taskDate = $('#taskDate').val();
            const taskStatus = $('#taskStatus').val();

            const taskCreateRequest = {
                listId: selectedListId, // Include the list ID here
                taskName: taskName,
                taskDate: taskDate,
                taskStatus: taskStatus
            };

            // Make a POST request to create the task
            $.ajax({
                url: "[[${@environment.getProperty('services.task-service.url')}]]" + 'tasks',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(taskCreateRequest),
                success: function(result) {
                    // Clear the form and reload tasks
                    $('#createTaskForm')[0].reset();
                    $('#createTaskModal').modal('hide'); // Hide the modal after success
                    loadTasksForList(selectedListId);
                },
                error: function(xhr, status, error) {
                    console.error('Error creating task:', xhr.responseText);
                    alert('Error creating task: ' + error);
                }
            });
        }

        function fetchTaskStatusOptions() {
            $.get("[[${@environment.getProperty('services.task-service.url')}]]" + "tasks/status-options", function(statusOptions) {
                const taskStatusDropdown = $('#taskStatus');
                taskStatusDropdown.empty(); // Clear existing options

                statusOptions.forEach(status => {
                    taskStatusDropdown.append(new Option(status, status));
                });
            }).fail(function(error) {
                console.error("Error fetching task status options:", error);
            });
        }

        // Attach event to show modal and fetch task status options
        $('#createTaskModal').on('show.bs.modal', fetchTaskStatusOptions);
    </script>
</body>
</html>
