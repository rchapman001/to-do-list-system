spring:
  application:
    name: to-do-list-ui

  profiles:
    active: desktop # Default profile

  mvc:
    hiddenmethod:
      filter:
        enabled: true # required for Spring MVC to support HTTP DELETE method

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: desktop

services:
  list-service:
    url: http://localhost:8082/
  task-service:
    url: http://localhost:8083/
  weather-service:
    url: http://localhost:8085/

---
spring:
  config:
    activate:
      on-profile: dev

services:
  list-service:
    url: http://host.docker.internal:8082/
  task-service:
    url: http://host.docker.internal:8083/
  weather-service:
    url: http://host.docker.internal:8085/

---
spring:
  config:
    activate:
      on-profile: test

services:
  list-service:
    url: http://localhost:8082/
  task-service:
    url: http://localhost:8083/
  weather-service:
    url: http://localhost:8085/
